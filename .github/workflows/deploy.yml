name: Deploy

# Publica las dos App Service. Se dispara al empujar a main y tambien a mano.
#
# LAS MIGRACIONES SON UN PASO DE ESTE PIPELINE, no del arranque de la app. Arrancar tocaba la
# base, y despertar una base serverless en pausa cuesta **una hora entera** de cuota (60 min es
# el retardo minimo de auto-pausa de Azure): cada reinicio del App Service —a diario en F1—
# costaba una hora de las ~55 que da el plan gratuito al mes.
#
# El paso no usa `dotnet ef database update`: el firewall del servidor SQL solo admite servicios
# de Azure y el principal de este workflow tiene `Website Contributor` acotado a las dos apps, sin
# permiso para tocar reglas de firewall. Darselo seria bajar la seguridad para arreglar un
# problema de coste. En su lugar se llama a un endpoint de la propia API, que ya tiene acceso
# legitimo a la base.
#
# Un commit de documentacion NO despliega (`paths-ignore`): reiniciar por un markdown se llevaba
# el 2% de la cuota del mes.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  # Dos despliegues a la vez sobre el mismo App Service se pisan.
  group: deploy-production
  cancel-in-progress: false

# La autenticacion es OIDC, no un perfil de publicacion.
#
# Los perfiles de publicacion NO sirven aqui: Azure crea las App Service nuevas con la
# autenticacion basica de SCM desactivada, y el despliegue falla con "Publish profile is
# invalid for app-name and slot-name provided". Se podria reactivar con una linea, pero es
# volver a poner credenciales de larga vida donde Azure decidio quitarlas. Con OIDC, GitHub se
# identifica con un token efimero de la propia ejecucion y en el repositorio no vive ningun
# secreto: solo identificadores.
permissions:
  id-token: write
  contents: read

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publicar
        run: dotnet publish src/Rent.Api/Rent.Api.csproj -c Release -o publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar
        uses: azure/webapps-deploy@v3
        with:
          app-name: rent-ca-net-ng-api
          package: publish

      - name: Comprobar que responde
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://rent-ca-net-ng-api.azurewebsites.net/health)
            if [ "$code" = "200" ]; then echo "API viva"; exit 0; fi
            sleep 10
          done
          echo "La API no respondio tras el despliegue"; exit 1

      # /health responde sin tocar la base, asi que el paso anterior NO prueba que la base este
      # bien: ese es justamente el objetivo del diseno. Aqui se migra y se siembra, de forma
      # explicita y una vez por despliegue, en vez de en cada reinicio.
      - name: Migrar y sembrar la base
        run: |
          TOKEN=$(az webapp config appsettings list \
            --name rent-ca-net-ng-api --resource-group rg-rent-ca-net \
            --query "[?name=='Database__MaintenanceToken'].value | [0]" -o tsv)

          # Se enmascara ANTES de cualquier uso: si el paso falla y GitHub vuelca el entorno, el
          # token no puede acabar en un log publico.
          echo "::add-mask::$TOKEN"

          if [ -z "$TOKEN" ]; then
            echo "Falta Database__MaintenanceToken en los ajustes de la API." >&2
            echo "Sin el, la ruta de mantenimiento responde 404 y la base se queda sin migrar." >&2
            exit 1
          fi

          # La base puede estar en auto-pausa: despertarla tarda. El endpoint ya espera por
          # dentro, pero el reintento cubre que el worker acabe de arrancar.
          for i in $(seq 1 5); do
            code=$(curl -s -o /tmp/migrate.json -w '%{http_code}' -m 300 \
              -X POST https://rent-ca-net-ng-api.azurewebsites.net/api/maintenance/migrate \
              -H "X-Maintenance-Token: $TOKEN")
            case "$code" in
              200) echo "Base migrada y sembrada:"; cat /tmp/migrate.json; exit 0 ;;
              409) echo "Ya hay una migracion en curso; se da por buena."; exit 0 ;;
              404) echo "La ruta no existe: token sin configurar en la API." >&2; exit 1 ;;
              401) echo "Token rechazado por la API." >&2; exit 1 ;;
              *)   echo "Intento $i: HTTP $code"; cat /tmp/migrate.json 2>/dev/null; sleep 15 ;;
            esac
          done
          echo "La migracion no llego a completarse." >&2; exit 1

  ssr:
    name: SSR (Angular + Node)
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/rent-client/package-lock.json

      - name: Instalar dependencias
        working-directory: src/rent-client
        run: npm ci

      - name: Compilar
        working-directory: src/rent-client
        run: npx ng build

      # Se publica el contenido de dist/rent-client tal cual: server.mjs resuelve el navegador
      # como `../browser` desde su propia carpeta, asi que el par server/ + browser/ tiene que
      # quedar en la raiz. El comando de arranque es `node server/server.mjs`.
      #
      # El bundle del servidor es autocontenido (solo importa modulos nativos de Node), asi que
      # no hace falta subir node_modules ni dejar que Oryx compile en el App Service.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar
        uses: azure/webapps-deploy@v3
        with:
          app-name: rent-ca-net-ng
          package: src/rent-client/dist/rent-client

      - name: Comprobar que responde
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://rent-ca-net-ng.azurewebsites.net/en)
            if [ "$code" = "200" ]; then echo "SSR vivo"; exit 0; fi
            sleep 10
          done
          echo "El SSR no respondio tras el despliegue"; exit 1
